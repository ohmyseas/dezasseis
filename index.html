<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#046a38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dezasseis">
  <title>Dezasseis — Português europeu</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <style>
    :root {
      --bg:       #0b0e14;
      --bg2:      #131820;
      --bg3:      #1a2130;
      --line:     #263040;
      --chalk:    #e6edf3;
      --muted:    #7a8fa8;
      --verde:    #046a38;
      --verde2:   #05883f;
      --verde3:   #09b854;
      --radius:   14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--chalk);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ── Layout wrapper ── */
    #app { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    header h1 { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 8px;
      background: var(--verde);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      vertical-align: middle;
      margin-left: 6px;
    }
    #audio-chip {
      font-size: 12px;
      letter-spacing: .06em;
      padding: 0 14px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--chalk);
      background: var(--bg2);
      cursor: pointer;
      transition: background .15s;
      gap: 6px;
      white-space: nowrap;
    }
    #audio-chip:hover { background: var(--bg3); }

    /* ── Section headers ── */
    section[data-section] { margin-bottom: 28px; }
    section[data-section] h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ── Tile grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .grid button[data-tool] {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 14px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--chalk);
      line-height: 1.3;
      transition: background .15s, transform .12s, border-color .15s;
    }
    .grid button[data-tool]:hover {
      background: var(--bg3);
      border-color: var(--verde2);
      transform: translateY(-2px);
    }
    .grid button[data-tool]:active { transform: scale(.97); }

    /* ── Tool view ── */
    #tool { padding-top: 8px; }
    #tool[hidden] { display: none; }

    .tool-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--verde3);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg2);
      margin-bottom: 20px;
      transition: background .15s;
    }
    .tool-back:hover { background: var(--bg3); }

    .tool-name {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 900;
      margin-bottom: 10px;
      color: var(--verde3);
    }
    .tool-under {
      font-size: 15px;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--line);
      border-left: 3px solid var(--verde);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 18px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Dezasseis <span class="badge">🇵🇹 pt-PT</span></h1>
    <div id="audio-chip" onclick="openTool('audio-setup')">🔊 Áudio</div>
  </header>

  <main id="home">
    <section data-section="start">
      <h2>🚀 Começar aqui</h2>
      <div class="grid">
        <button data-tool="do-espanhol">Do Espanhol</button>
        <button data-tool="ouvido">Ouvido</button>
        <button data-tool="situacao">Situação</button>
        <button data-tool="frases">Frases Essenciais</button>
      </div>
    </section>

    <section data-section="estudo">
      <h2>📚 Estudo</h2>
      <div class="grid">
        <button data-tool="estudo">Estudo (16 lições)</button>
        <button data-tool="verbos">Máquina de Verbos</button>
      </div>
    </section>

    <section data-section="gramatica">
      <h2>🧠 Gramática</h2>
      <div class="grid">
        <button data-tool="cola">Cola Gramatical</button>
        <button data-tool="por-para">Por vs Para</button>
        <button data-tool="ser-estar">Ser vs Estar</button>
        <button data-tool="conjuntivo">Conjuntivo</button>
        <button data-tool="falsos">Falsos Amigos</button>
      </div>
    </section>

    <section data-section="referencia">
      <h2>📖 Referência</h2>
      <div class="grid">
        <button data-tool="objetos">Objetos</button>
        <button data-tool="numeros">Números</button>
        <button data-tool="tempo">Tempo e Datas</button>
      </div>
    </section>

    <section data-section="vivo">
      <h2>🎭 Português Vivo</h2>
      <div class="grid">
        <button data-tool="calao">Calão de Portugal</button>
        <button data-tool="ditados">Ditados e Cultura</button>
      </div>
    </section>
  </main>

  <main id="tool" hidden></main>
</div>

<script>
  /* ── Navigation ── */
  function openTool(name) {
    document.getElementById('home').hidden = true;
    const t = document.getElementById('tool');
    t.hidden = false;
    t.innerHTML = `
      <button class="tool-back" onclick="goHome()">← Voltar</button>
      <div class="tool-name">${name}</div>
      <div class="tool-under">Em construção.</div>
    `;
  }
  function goHome() {
    document.getElementById('home').hidden = false;
    document.getElementById('tool').hidden = true;
  }
  document.querySelectorAll('[data-tool]').forEach(b => {
    b.onclick = () => openTool(b.dataset.tool);
  });

  /* ── Schema validation stub ── */
  const SCHEMAS = {
    // Blocks register their schemas here as they get authored.
    // Example (added later):
    // VERBS: v => Array.isArray(v) && v.every(x => x.infinitive && x.conjugations && Object.keys(x.conjugations).length === 9 && Object.values(x.conjugations).every(t => t.length === 6)),
  };
  function validateAll() {
    const failed = [];
    for (const [name, schema] of Object.entries(SCHEMAS)) {
      try {
        if (!schema(window[name])) failed.push(name);
      } catch (e) {
        console.error(`Schema exception ${name}:`, e);
        failed.push(name);
      }
    }
    if (failed.length) {
      console.error(`SCHEMA FAILURES: ${failed.join(', ')}`);
      document.body.insertAdjacentHTML('afterbegin',
        `<div style="background:#a00;color:#fff;padding:8px;text-align:center;font-family:monospace;">
         ⚠️ Erro de dados: ${failed.join(', ')} — tools escondidas.</div>`);
      failed.forEach(name => hideToolFor(name));
    }
  }
  function hideToolFor(dataBlockName) {
    // Map from data-block name to tool tile[data-tool] to hide.
    const toolFromBlock = {
      VERBS: 'verbos', OBJETOS_DATA: 'objetos', SLANG_DATA: 'calao',
      FALSE_FRIENDS_DATA: 'falsos', OUVIDO_DATA: 'ouvido',
      SITUACAO_DATA: 'situacao', /* etc */
    };
    const tool = toolFromBlock[dataBlockName];
    if (tool) document.querySelectorAll(`[data-tool="${tool}"]`).forEach(b => b.hidden = true);
  }
  // Call after all data blocks defined:
  window.addEventListener('DOMContentLoaded', validateAll);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
</script>
</body>
</html>
