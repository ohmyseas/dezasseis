<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#046a38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dezasseis">
  <title>Dezasseis — Português europeu</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <style>
    :root {
      --bg:       #0b0e14;
      --bg2:      #131820;
      --bg3:      #1a2130;
      --line:     #263040;
      --chalk:    #e6edf3;
      --muted:    #7a8fa8;
      --verde:    #046A38;
      --verde2:   #05883f;
      --verde3:   #09b854;
      --vermelho: #DA291C;
      --radius:   14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--chalk);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ── Layout wrapper ── */
    #app { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    header h1 { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--verde) 40%, var(--vermelho) 100%);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      vertical-align: middle;
      margin-left: 6px;
    }
    #audio-chip {
      font-size: 12px;
      letter-spacing: .06em;
      padding: 0 14px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--chalk);
      background: var(--bg2);
      cursor: pointer;
      transition: background .15s;
      gap: 6px;
      white-space: nowrap;
    }
    #audio-chip:hover { background: var(--bg3); border-color: var(--vermelho); }
    #audio-chip:active { border-color: var(--vermelho); color: var(--vermelho); }

    /* ── Section headers ── */
    section[data-section] { margin-bottom: 28px; }
    section[data-section] h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-en {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
      margin-bottom: 12px;
      padding-left: 2px;
    }
    section[data-section="vivo"] h2 { color: var(--vermelho); opacity: 0.85; }

    /* ── Tile grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .grid button[data-tool] {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 14px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--chalk);
      line-height: 1.3;
      transition: background .15s, transform .12s, border-color .15s;
    }
    .grid button .pt { display: block; font-size: 1rem; font-weight: 600; }
    .grid button .en { display: block; font-size: 0.75rem; opacity: 0.65; margin-top: 3px; font-weight: 400; letter-spacing: 0.02em; color: var(--muted); }
    .grid button[data-tool]:hover {
      background: var(--bg3);
      border-color: var(--verde2);
      transform: translateY(-2px);
    }
    .grid button[data-tool]:active { transform: scale(.97); }

    /* ── Tool view ── */
    #tool { padding-top: 8px; }
    #tool[hidden] { display: none; }

    .tool-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--verde3);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg2);
      margin-bottom: 20px;
      transition: background .15s;
    }
    .tool-back:hover { background: var(--bg3); }

    .tool-name {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 900;
      margin-bottom: 10px;
      color: var(--verde3);
    }
    .tool-under {
      font-size: 15px;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--line);
      border-left: 3px solid var(--verde);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 18px;
      margin-top: 16px;
    }

    /* ── Audio Setup Modal ── */
    #audio-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      padding: 16px;
    }
    #audio-modal[hidden] { display: none; }
    #audio-modal-panel {
      width: 100%;
      max-width: 480px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 20px 20px 16px 16px;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 {
      font-size: 18px;
      font-weight: 800;
    }
    .modal-close {
      font-size: 22px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
      color: var(--muted);
      background: var(--bg3);
      border: 1px solid var(--line);
    }
    .modal-close:hover { color: var(--chalk); }

    /* Voice toggle */
    .voice-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .voice-group label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .voice-options {
      display: flex;
      gap: 8px;
    }
    .voice-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg3);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: border-color .15s, background .15s;
    }
    .voice-option:has(input:checked) {
      border-color: var(--verde2);
      background: rgba(5,136,63,.12);
    }
    .voice-option input[type="radio"] { display: none; }

    /* API key input */
    .key-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .key-group label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .key-group .key-hint {
      font-size: 11px;
      color: var(--muted);
    }
    .key-group input[type="text"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      color: var(--chalk);
      outline: none;
      transition: border-color .15s;
    }
    .key-group input[type="text"]::placeholder { color: var(--muted); }
    .key-group input[type="text"]:focus { border-color: var(--verde2); }

    /* Action buttons row */
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .btn-test {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      background: var(--verde);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-test:hover { background: var(--verde2); }
    .btn-test:active { transform: scale(.97); }
    .btn-forvo {
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg3);
      color: var(--chalk);
      border: 1px solid var(--line);
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-forvo:hover { background: var(--bg); }

    /* Diagnostic panel */
    #audio-diag {
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 36px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #audio-diag.ok { color: var(--verde3); border-color: var(--verde); }
    #audio-diag.err { color: #f87171; border-color: #7f1d1d; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e2d3d;
      color: var(--chalk);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.success { border-color: var(--verde); color: var(--verde3); }
    #toast.error   { border-color: var(--vermelho); color: #f87171; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Dezasseis <span class="badge">🇵🇹 pt-PT</span></h1>
    <div id="audio-chip" role="button" tabindex="0" aria-haspopup="dialog">🔊 Áudio</div>
  </header>

  <main id="home">
    <section data-section="start">
      <h2>🚀 Começar aqui</h2>
      <span class="section-en">start here</span>
      <div class="grid">
        <button data-tool="do-espanhol">
          <span class="pt">Do Espanhol</span>
          <span class="en">from spanish</span>
        </button>
        <button data-tool="ouvido">
          <span class="pt">Ouvido</span>
          <span class="en">ear · listening</span>
        </button>
        <button data-tool="situacao">
          <span class="pt">Situação</span>
          <span class="en">situation · dialogues</span>
        </button>
        <button data-tool="frases">
          <span class="pt">Frases Essenciais</span>
          <span class="en">essential phrases</span>
        </button>
      </div>
    </section>

    <section data-section="estudo">
      <h2>📚 Estudo</h2>
      <span class="section-en">study</span>
      <div class="grid">
        <button data-tool="estudo">
          <span class="pt">Estudo (16 lições)</span>
          <span class="en">study · 16 lessons</span>
        </button>
        <button data-tool="verbos">
          <span class="pt">Máquina de Verbos</span>
          <span class="en">verb machine</span>
        </button>
      </div>
    </section>

    <section data-section="gramatica">
      <h2>🧠 Gramática</h2>
      <span class="section-en">grammar</span>
      <div class="grid">
        <button data-tool="cola">
          <span class="pt">Cola Gramatical</span>
          <span class="en">grammar glue</span>
        </button>
        <button data-tool="por-para">
          <span class="pt">Por vs Para</span>
          <span class="en">por vs para</span>
        </button>
        <button data-tool="ser-estar">
          <span class="pt">Ser vs Estar</span>
          <span class="en">ser vs estar</span>
        </button>
        <button data-tool="conjuntivo">
          <span class="pt">Conjuntivo</span>
          <span class="en">subjunctive</span>
        </button>
        <button data-tool="falsos">
          <span class="pt">Falsos Amigos</span>
          <span class="en">false friends</span>
        </button>
      </div>
    </section>

    <section data-section="referencia">
      <h2>📖 Referência</h2>
      <span class="section-en">reference</span>
      <div class="grid">
        <button data-tool="objetos">
          <span class="pt">Objetos</span>
          <span class="en">objects · nouns</span>
        </button>
        <button data-tool="numeros">
          <span class="pt">Números</span>
          <span class="en">numbers</span>
        </button>
        <button data-tool="tempo">
          <span class="pt">Tempo e Datas</span>
          <span class="en">time &amp; dates</span>
        </button>
      </div>
    </section>

    <section data-section="vivo">
      <h2>🎭 Português Vivo</h2>
      <span class="section-en">living portuguese</span>
      <div class="grid">
        <button data-tool="calao">
          <span class="pt">Calão de Portugal</span>
          <span class="en">portuguese slang</span>
        </button>
        <button data-tool="ditados">
          <span class="pt">Ditados e Cultura</span>
          <span class="en">sayings &amp; culture</span>
        </button>
      </div>
    </section>
  </main>

  <main id="tool" hidden></main>
</div>

<!-- ── Audio Setup Modal ── -->
<div id="audio-modal" hidden role="dialog" aria-modal="true" aria-labelledby="audio-modal-title">
  <div id="audio-modal-panel">
    <div class="modal-header">
      <h2 id="audio-modal-title">🔊 Configuração de Áudio</h2>
      <button class="modal-close" id="audio-modal-close" aria-label="Fechar">✕</button>
    </div>

    <div class="voice-group">
      <label>Voz</label>
      <div class="voice-options">
        <label class="voice-option">
          <input type="radio" name="dezasseis-voice" value="joana" id="voice-joana">
          👩 Joana <span style="font-size:11px;color:var(--muted)">(padrão)</span>
        </label>
        <label class="voice-option">
          <input type="radio" name="dezasseis-voice" value="paulo" id="voice-paulo">
          👨 Paulo PT
        </label>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-test" id="audio-test-btn">▶ Testar — os pães são bons</button>
      <a class="btn-forvo" href="https://forvo.com/word/bom_dia/#pt" target="_blank" rel="noopener">📖 Forvo</a>
    </div>

    <div class="key-group">
      <label>Chave API (opcional — depuração local)</label>
      <input type="text" id="tts-key-input" placeholder="sk-…" autocomplete="off" spellcheck="false">
      <span class="key-hint">Deixe em branco — a app usa a chave do servidor. Só necessário para testes locais.</span>
    </div>

    <div id="audio-diag">Pronto.</div>
  </div>
</div>

<div id="toast"></div>

<script>
  /* ── Toast ── */
  let _toastTimer;
  function showToast(msg, duration = 3500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  }

  /* ── TTS helper ── */
  async function speak(text, opts = {}) {
    const voice = opts.voiceOverride
      || localStorage.getItem('dezasseis:voice')
      || 'joana';
    const diag = document.getElementById('audio-diag');
    if (diag) {
      diag.className = '';
      diag.textContent = `A enviar… voz=${voice}`;
    }
    let r;
    try {
      r = await fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice }),
      });
    } catch (e) {
      const msg = `Erro de rede: ${e.message}`;
      showToast(`🔇 ${msg}`);
      if (diag) { diag.className = 'err'; diag.textContent = msg; }
      return;
    }
    if (!r.ok) {
      const msg = `TTS erro: ${r.status} ${r.statusText}`;
      showToast(`🔇 ${msg}`);
      if (diag) { diag.className = 'err'; diag.textContent = msg; }
      return;
    }
    if (r.headers.get('X-Voice-Fallback') === 'sarah') {
      showToast('Voz principal indisponível — a usar Sarah');
      if (diag) diag.textContent = 'Fallback para Sarah (voz principal indisponível)';
    } else if (diag) {
      diag.className = 'ok';
      diag.textContent = `OK — voz=${voice}, ${r.headers.get('Content-Length') || '?'} bytes`;
    }
    const blob = await r.blob();
    const audio = new Audio(URL.createObjectURL(blob));
    audio.play();
  }

  /* ── Navigation ── */
  function openTool(name) {
    document.getElementById('home').hidden = true;
    const t = document.getElementById('tool');
    t.hidden = false;
    t.innerHTML = `
      <button class="tool-back" onclick="goHome()">← Voltar</button>
      <div class="tool-name">${name}</div>
      <div class="tool-under">Em construção.</div>
    `;
  }
  function goHome() {
    document.getElementById('home').hidden = false;
    document.getElementById('tool').hidden = true;
  }
  document.querySelectorAll('[data-tool]').forEach(b => {
    b.onclick = () => openTool(b.dataset.tool);
  });

  /* ── Audio Setup Modal ── */
  function openAudioModal() {
    // Restore saved voice preference into radio buttons
    const savedVoice = localStorage.getItem('dezasseis:voice') || 'joana';
    const radio = document.querySelector(`input[name="dezasseis-voice"][value="${savedVoice}"]`);
    if (radio) radio.checked = true;

    // Restore saved API key (optional debug field)
    const savedKey = localStorage.getItem('dezasseis:ttsKey') || '';
    const keyInput = document.getElementById('tts-key-input');
    if (keyInput) keyInput.value = savedKey;

    // Reset diagnostic
    const diag = document.getElementById('audio-diag');
    if (diag) { diag.className = ''; diag.textContent = 'Pronto.'; }

    document.getElementById('audio-modal').hidden = false;
    document.getElementById('audio-modal-close').focus();
  }
  function closeAudioModal() {
    document.getElementById('audio-modal').hidden = true;
  }

  // Wire #audio-chip → open modal (overrides the openTool call in the onclick attr)
  document.getElementById('audio-chip').onclick = (e) => {
    e.preventDefault();
    openAudioModal();
  };

  document.getElementById('audio-modal-close').onclick = closeAudioModal;

  // Close on backdrop click
  document.getElementById('audio-modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('audio-modal')) closeAudioModal();
  });

  // Close on Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.getElementById('audio-modal').hidden) closeAudioModal();
  });

  // Voice toggle → persist to localStorage
  document.querySelectorAll('input[name="dezasseis-voice"]').forEach(radio => {
    radio.addEventListener('change', () => {
      if (radio.checked) localStorage.setItem('dezasseis:voice', radio.value);
    });
  });

  // Optional API key → persist to localStorage on blur
  document.getElementById('tts-key-input').addEventListener('blur', () => {
    const val = document.getElementById('tts-key-input').value.trim();
    if (val) localStorage.setItem('dezasseis:ttsKey', val);
    else localStorage.removeItem('dezasseis:ttsKey');
  });

  // Test button → speak pt-PT test sentence
  document.getElementById('audio-test-btn').onclick = () => {
    speak('os pães são bons');
  };

  /* ────────────────────────────────────────────────────────────
     VERBS — 182 pt-PT verbs × 9 tenses × 6 person-forms
     Generated per Task 1.3 (Option C hybrid: 146 mirror from
     Dieciséis + 36 pt-PT-life additions).
     ──────────────────────────────────────────────────────────── */

  const PRONOUNS_PT = ['eu','tu','ele/ela/você','nós','vós','eles/elas/vocês'];

  const TENSE_META = {
    presente:          { label: 'Presente',                    drilled: true  },
    pret_perf_simples: { label: 'Pretérito Perfeito Simples',  drilled: true  },
    pret_imperfeito:   { label: 'Pretérito Imperfeito',        drilled: true  },
    futuro_perifr:     { label: 'Futuro Perifrástico',         drilled: true  },
    futuro_simples:    { label: 'Futuro Simples',              drilled: false },
    condicional:       { label: 'Condicional',                 drilled: false },
    pres_conjuntivo:   { label: 'Presente do Conjuntivo',      drilled: false },
    fut_conjuntivo:    { label: 'Futuro do Conjuntivo',        drilled: false },
    inf_pessoal:       { label: 'Infinitivo Pessoal',          drilled: false },
  };

  /* ── Auxiliary "ir" for Futuro Perifrástico (hand-set since ir is irregular) ── */
  const IR_AUX = ['vou','vais','vai','vamos','ides','vão'];

  /* ── Regular-conjugation engine ── */
  function conjRegular(inf) {
    const stem = inf.slice(0, -2);
    const fam = inf.slice(-2); // 'ar' | 'er' | 'ir'

    // Preterite 1sg orthographic mutations for -ar family
    let stem1sgPret = stem;
    if (fam === 'ar') {
      if (stem.endsWith('c')) stem1sgPret = stem.slice(0, -1) + 'qu';   // ficar → fiquei
      else if (stem.endsWith('g')) stem1sgPret = stem + 'u';             // pagar → paguei
      else if (stem.endsWith('ç')) stem1sgPret = stem.slice(0, -1) + 'c';// começar → comecei
    }
    // Presente 1sg orthographic mutations for -er/-ir families
    // (before 'o': c→ç, g→j)
    let stem1sgPres = stem;
    if (fam === 'er' || fam === 'ir') {
      if (stem.endsWith('c')) stem1sgPres = stem.slice(0, -1) + 'ç';   // vencer → venço

    let presente;
    if (fam === 'ar') {
      presente = [stem+'o', stem+'as', stem+'a', stem+'amos', stem+'ais', stem+'am'];
    } else if (fam === 'er') {

    } else {

    if (fam === 'ar') {

    let presConj;
    if (fam === 'ar') {

    // --- Infinitivo Pessoal ---
    const infPess = [inf, inf+'es', inf, inf+'mos', inf+'des', inf+'em'];

      presente,
      pret_perf_simples: pret,
      pret_imperfeito: imperf,
      futuro_perifr: futPerifr,
      futuro_simples: futSimp,
      condicional: cond,
      pres_conjuntivo: presConj,
      fut_conjuntivo: futConj,

  /* ── Build VERBS: engine + overrides ──
     Overrides in IRREGULAR_OVERRIDES are full 9-tense tables and replace
     the engine output entirely for irregulars. Regulars use conjRegular. */
  const VERBS = VERB_LIST.map(inf => {
    const meta = VERB_META[inf] || { en: '?', cat: 'accoes' };
    const override = IRREGULAR_OVERRIDES[inf];
    const conjugations = override
      ? override
      : conjRegular(inf);
    return { infinitive: inf, en: meta.en, category: meta.cat, conjugations };
  });

  // Expose for schema validator (needs to read window.VERBS)
  window.VERBS = VERBS;
  window.PRONOUNS_PT = PRONOUNS_PT;
  window.TENSE_META = TENSE_META;
  window.VERB_CATEGORIES_PT = VERB_CATEGORIES_PT;


  /* ── Schema validation stub ── */
  const SCHEMAS = {
    // Blocks register their schemas here as they get authored.
    VERBS: v => Array.isArray(v) && v.length >= 150
      && v.every(x => x.infinitive && x.category && x.conjugations
        && Object.keys(x.conjugations).length === 9
        && Object.values(x.conjugations).every(t => Array.isArray(t) && t.length === 6)),
  };
  function validateAll() {
    const failed = [];
    for (const [name, schema] of Object.entries(SCHEMAS)) {
      try {
        if (!schema(window[name])) failed.push(name);
      } catch (e) {
        console.error(`Schema exception ${name}:`, e);
        failed.push(name);
      }
    }
    if (failed.length) {
      console.error(`SCHEMA FAILURES: ${failed.join(', ')}`);
      document.body.insertAdjacentHTML('afterbegin',
        `<div style="background:#a00;color:#fff;padding:8px;text-align:center;font-family:monospace;">
         ⚠️ Erro de dados: ${failed.join(', ')} — tools escondidas.</div>`);
      failed.forEach(name => hideToolFor(name));
    }
  }
  function hideToolFor(dataBlockName) {
    // Map from data-block name to tool tile[data-tool] to hide.
    const toolFromBlock = {
      VERBS: 'verbos', OBJETOS_DATA: 'objetos', SLANG_DATA: 'calao',
      FALSE_FRIENDS_DATA: 'falsos', OUVIDO_DATA: 'ouvido',
      SITUACAO_DATA: 'situacao', /* etc */
    };
    const tool = toolFromBlock[dataBlockName];
    if (tool) document.querySelectorAll(`[data-tool="${tool}"]`).forEach(b => b.hidden = true);
  }
  // Call after all data blocks defined:
  window.addEventListener('DOMContentLoaded', validateAll);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
