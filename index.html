<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#046a38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dezasseis">
  <title>Dezasseis — Português europeu</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <style>
    :root {
      --bg:       #0b0e14;
      --bg2:      #131820;
      --bg3:      #1a2130;
      --line:     #263040;
      --chalk:    #e6edf3;
      --muted:    #7a8fa8;
      --verde:    #046A38;
      --verde2:   #05883f;
      --verde3:   #09b854;
      --vermelho: #DA291C;
      --radius:   14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--chalk);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* ── Layout wrapper ── */
    #app { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    header h1 { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--verde) 40%, var(--vermelho) 100%);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      vertical-align: middle;
      margin-left: 6px;
    }
    #audio-chip {
      font-size: 12px;
      letter-spacing: .06em;
      padding: 0 14px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--chalk);
      background: var(--bg2);
      cursor: pointer;
      transition: background .15s;
      gap: 6px;
      white-space: nowrap;
    }
    #audio-chip:hover { background: var(--bg3); border-color: var(--vermelho); }
    #audio-chip:active { border-color: var(--vermelho); color: var(--vermelho); }

    /* ── Section headers ── */
    section[data-section] { margin-bottom: 28px; }
    section[data-section] h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-en {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
      margin-bottom: 12px;
      padding-left: 2px;
    }
    section[data-section="vivo"] h2 { color: var(--vermelho); opacity: 0.85; }

    /* ── Tile grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .grid button[data-tool] {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 14px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--chalk);
      line-height: 1.3;
      transition: background .15s, transform .12s, border-color .15s;
    }
    .grid button .pt { display: block; font-size: 1rem; font-weight: 600; }
    .grid button .en { display: block; font-size: 0.75rem; opacity: 0.65; margin-top: 3px; font-weight: 400; letter-spacing: 0.02em; color: var(--muted); }
    .grid button[data-tool]:hover {
      background: var(--bg3);
      border-color: var(--verde2);
      transform: translateY(-2px);
    }
    .grid button[data-tool]:active { transform: scale(.97); }

    /* ── Tool view ── */
    #tool { padding-top: 8px; }
    #tool[hidden] { display: none; }

    .tool-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--verde3);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg2);
      margin-bottom: 20px;
      transition: background .15s;
    }
    .tool-back:hover { background: var(--bg3); }

    .tool-name {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 900;
      margin-bottom: 10px;
      color: var(--verde3);
    }
    .tool-under {
      font-size: 15px;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--line);
      border-left: 3px solid var(--verde);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 18px;
      margin-top: 16px;
    }

    /* ── Audio Setup Modal ── */
    #audio-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      padding: 16px;
    }
    #audio-modal[hidden] { display: none; }
    #audio-modal-panel {
      width: 100%;
      max-width: 480px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 20px 20px 16px 16px;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 {
      font-size: 18px;
      font-weight: 800;
    }
    .modal-close {
      font-size: 22px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
      color: var(--muted);
      background: var(--bg3);
      border: 1px solid var(--line);
    }
    .modal-close:hover { color: var(--chalk); }

    /* Voice toggle */
    .voice-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .voice-group label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .voice-options {
      display: flex;
      gap: 8px;
    }
    .voice-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg3);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: border-color .15s, background .15s;
    }
    .voice-option:has(input:checked) {
      border-color: var(--verde2);
      background: rgba(5,136,63,.12);
    }
    .voice-option input[type="radio"] { display: none; }

    /* API key input */
    .key-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .key-group label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .key-group .key-hint {
      font-size: 11px;
      color: var(--muted);
    }
    .key-group input[type="text"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      color: var(--chalk);
      outline: none;
      transition: border-color .15s;
    }
    .key-group input[type="text"]::placeholder { color: var(--muted); }
    .key-group input[type="text"]:focus { border-color: var(--verde2); }

    /* Action buttons row */
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .btn-test {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      background: var(--verde);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-test:hover { background: var(--verde2); }
    .btn-test:active { transform: scale(.97); }
    .btn-forvo {
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg3);
      color: var(--chalk);
      border: 1px solid var(--line);
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-forvo:hover { background: var(--bg); }

    /* Diagnostic panel */
    #audio-diag {
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 36px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #audio-diag.ok { color: var(--verde3); border-color: var(--verde); }
    #audio-diag.err { color: #f87171; border-color: #7f1d1d; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e2d3d;
      color: var(--chalk);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.success { border-color: var(--verde); color: var(--verde3); }
    #toast.error   { border-color: var(--vermelho); color: #f87171; }

    /* ── Verb Machine ── */

    /* Search + filter bar */
    .vm-search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .vm-search-input {
      flex: 1;
      min-width: 160px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--chalk);
      outline: none;
      transition: border-color .15s;
    }
    .vm-search-input::placeholder { color: var(--muted); }
    .vm-search-input:focus { border-color: var(--verde2); }

    /* Category chips */
    .vm-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .vm-chip {
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--bg2);
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .vm-chip:hover { border-color: var(--verde2); color: var(--chalk); }
    .vm-chip.active { background: var(--verde); border-color: var(--verde2); color: #fff; }

    /* Verb list */
    .vm-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vm-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 16px;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
      gap: 10px;
      text-align: left;
    }
    .vm-card:hover { background: var(--bg3); border-color: var(--verde2); transform: translateX(3px); }
    .vm-card:active { transform: scale(.98); }
    .vm-card-left { display: flex; flex-direction: column; gap: 2px; }
    .vm-card-inf { font-size: 16px; font-weight: 700; color: var(--chalk); }
    .vm-card-en  { font-size: 12px; color: var(--muted); }
    .vm-card-cat {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg3);
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
    }
    .vm-count {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Section headers for category grouping */
    .vm-section {
      margin-bottom: 20px;
    }
    .vm-section-h {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--verde3);
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--verde);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .vm-section-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    .vm-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Full verb view */
    .vm-verb-header {
      margin-bottom: 20px;
    }
    .vm-verb-inf {
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 900;
      color: var(--verde3);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .vm-verb-en {
      font-size: 16px;
      font-weight: 400;
      color: var(--muted);
    }
    .vm-verb-cat-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
      background: var(--bg2);
      border: 1px solid var(--line);
      color: var(--muted);
      margin-top: 6px;
      display: inline-block;
    }

    /* Tense section */
    .tense-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .tense-section.tense-drilled { border-color: var(--line); }
    .tense-section.tense-recognize { border-color: #1e2a38; opacity: 0.85; }

    .tense-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: var(--bg2);
      cursor: pointer;
      user-select: none;
      gap: 10px;
    }
    .tense-drilled .tense-header { background: var(--bg2); }
    .tense-recognize .tense-header { background: #0f161f; }

    .tense-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tense-label {
      font-size: 14px;
      font-weight: 700;
    }
    .tense-drilled .tense-label { color: var(--chalk); }
    .tense-recognize .tense-label { color: #6e7681; }

    .tense-recognize-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      background: #1a2233;
      color: #4a5f7a;
      border: 1px solid #1e2d42;
    }

    .tense-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tense-info-btn {
      font-size: 15px;
      padding: 2px 6px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, color .15s;
      line-height: 1;
    }
    .tense-info-btn:hover { background: var(--bg3); color: var(--chalk); border-color: var(--line); }
    .tense-listen-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--bg3);
      border: 1px solid var(--line);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .tense-listen-btn:hover { background: var(--verde); color: #fff; border-color: var(--verde2); }
    .tense-toggle-arrow {
      font-size: 13px;
      color: var(--muted);
      transition: transform .2s;
    }
    .tense-section.collapsed .tense-toggle-arrow { transform: rotate(-90deg); }

    /* Theory panel */
    .tense-theory {
      background: #0d1520;
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #9db5cc;
      display: none;
    }
    .tense-theory.open { display: block; }
    .tense-theory em { font-style: italic; color: var(--chalk); }
    .tense-theory code {
      font-family: 'Courier New', monospace;
      background: #1a2233;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--verde3);
    }

    /* Forms grid */
    .tense-forms {
      padding: 10px 14px 12px;
      background: var(--bg);
    }
    .tense-section.collapsed .tense-forms { display: none; }
    .form-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #111922;
    }
    .form-row:last-child { border-bottom: none; }
    .form-pronoun {
      width: 130px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .form-word {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
    }
    .tense-drilled .form-word { color: var(--chalk); }
    .tense-recognize .form-word { color: #6e7681; }

    /* vós row muting */
    .form-row.form-vos .form-pronoun,
    .form-row.form-vos .form-word {
      color: #4a5f6a;
      opacity: 0.6;
    }
    .form-row.form-vos .form-word {
      font-style: italic;
    }
    .vos-hint {
      font-size: 10px;
      color: #3a4f5a;
      font-style: italic;
      margin-left: 4px;
    }

    .form-speak-btn {
      font-size: 14px;
      padding: 3px 7px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: #3a5268;
      cursor: pointer;
      transition: background .12s, color .12s;
      line-height: 1;
      flex-shrink: 0;
    }
    .form-speak-btn:hover { background: var(--bg2); color: var(--verde3); border-color: var(--line); }
    .form-speak-btn:active { transform: scale(.92); }

    /* ── Praticar button ── */
    .btn-praticar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      background: var(--verde);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .12s;
      letter-spacing: .02em;
    }
    .btn-praticar:hover { background: var(--verde2); }
    .btn-praticar:active { transform: scale(.96); }

    /* ── Drill screen ── */
    .drill-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .drill-score {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 14px;
      letter-spacing: .04em;
    }
    .drill-score .drill-correct { color: var(--verde3); }
    .drill-score .drill-wrong   { color: #f87171; }
    .drill-card {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px 20px 20px;
      margin-bottom: 16px;
    }
    .drill-tense-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--verde3);
      margin-bottom: 10px;
    }
    .drill-verb-en {
      font-size: 20px;
      font-weight: 800;
      color: var(--chalk);
      margin-bottom: 4px;
    }
    .drill-infinitive {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .drill-pronoun {
      font-size: 16px;
      font-weight: 600;
      color: var(--chalk);
      margin-bottom: 16px;
    }
    .drill-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .drill-input {
      width: 100%;
      background: var(--bg3);
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 18px;
      font-family: inherit;
      color: var(--chalk);
      outline: none;
      transition: border-color .15s;
    }
    .drill-input:focus { border-color: var(--verde2); }
    .drill-input.correct { border-color: var(--verde2); background: rgba(5,136,63,.1); }
    .drill-input.wrong   { border-color: var(--vermelho); background: rgba(218,41,28,.07); }
    .drill-feedback {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
    }
    .drill-feedback.ok     { color: var(--verde3); }
    .drill-feedback.err    { color: #f87171; }
    .drill-feedback.accent { color: #f0c040; }
    .drill-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .btn-proximo {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      background: var(--verde);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-proximo:hover { background: var(--verde2); }
    .btn-proximo:active { transform: scale(.97); }
    .btn-sair {
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      background: var(--bg3);
      color: var(--chalk);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-sair:hover { background: var(--bg); }

    /* ── Estudo (16-lesson module) ── */
    .estudo-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .estudo-tile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
      text-align: left;
      gap: 12px;
    }
    .estudo-tile:hover { background: var(--bg3); border-color: var(--verde2); transform: translateX(3px); }
    .estudo-tile:active { transform: scale(.98); }
    .estudo-tile.locked { opacity: 0.45; cursor: not-allowed; }
    .estudo-tile.locked:hover { transform: none; border-color: var(--line); background: var(--bg2); }
    .estudo-tile.completed { border-color: var(--verde); }
    .estudo-tile-left { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .estudo-tile-num { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .estudo-tile-title { font-size: 16px; font-weight: 700; color: var(--chalk); }
    .estudo-tile-en { font-size: 12px; color: var(--muted); }
    .estudo-tile-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

      font-size: 12px; font-weight: 700; padding: 2px 9px;

    .estudo-lock-icon { font-size: 16px; color: var(--muted); }

    /* Lesson detail */
    .lesson-header { margin-bottom: 20px; }
    .lesson-title-pt { font-size: clamp(22px,5vw,32px); font-weight: 900; color: var(--verde3); margin-bottom: 4px; }
    .lesson-title-en { font-size: 13px; color: var(--muted); }
    .lesson-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .lesson-tab {
      padding: 8px 18px; border-radius: 20px; border: 1px solid var(--line);
      background: var(--bg2); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .lesson-tab.active { background: var(--verde); border-color: var(--verde2); color: #fff; }
    .lesson-tab:hover:not(.active) { background: var(--bg3); border-color: var(--verde2); color: var(--chalk); }
    .lesson-notes { margin-bottom: 20px; line-height: 1.7; }
    .lesson-notes p { margin-bottom: 12px; }
    .lesson-notes b { color: var(--verde3); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
    .lesson-notes em { color: var(--chalk); font-style: italic; }

    .lesson-table {
      width: 100%; border-collapse: collapse; margin-bottom: 16px;
      background: var(--bg2); border-radius: 10px; overflow: hidden;
      border: 1px solid var(--line);
    }
    .lesson-table-title {
      font-size: 12px; font-weight: 700; letter-spacing: .08em;

    .lesson-table tr:last-child td { border-bottom: none; }
    .lesson-table td:first-child { color: var(--chalk); font-weight: 600; width: 50%; cursor: pointer; }
    .lesson-table td:first-child:hover { color: var(--verde3); }

    .vocab-section { margin-bottom: 20px; }
    .vocab-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

      display: flex; align-items: center; justify-content: space-between;

    .estudo-drill-opt.correct { border-color: var(--verde); background: rgba(4,106,56,.18); color: var(--verde3); }
    .estudo-drill-opt.wrong { border-color: var(--vermelho); background: rgba(218,41,28,.1); color: #f87171; }

    .estudo-drill-feedback.ok { color: var(--verde3); }
    .estudo-drill-feedback.err { color: #f87171; }

    /* Quiz */

    .quiz-opts { display: flex; flex-direction: column; gap: 8px; }

    .quiz-opt.correct { border-color: var(--verde); background: rgba(4,106,56,.18); color: var(--verde3); }
    .quiz-opt.wrong { border-color: var(--vermelho); background: rgba(218,41,28,.1); color: #f87171; }
    .quiz-progress { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-weight: 700; letter-spacing: .06em; }
    .quiz-result { text-align: center; padding: 32px 20px; }
    .quiz-result-score { font-size: 48px; font-weight: 900; margin-bottom: 12px; }
    .quiz-result-score.pass { color: var(--verde3); }
    .quiz-result-score.fail { color: #f87171; }
    .quiz-result-msg { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
    .quiz-result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-estudo {
      padding: 12px 22px; border-radius: 12px; font-size: 15px; font-weight: 700;
      background: var(--verde); color: #fff; border: none; cursor: pointer;
      transition: background .15s;
    }
    .btn-estudo:hover { background: var(--verde2); }
    .btn-estudo.secondary { background: var(--bg3); color: var(--chalk); border: 1px solid var(--line); }
    .btn-estudo.secondary:hover { background: var(--bg); }
    .btn-estudo.small { padding: 9px 16px; font-size: 13px; }
    .btn-unlock { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
      background: var(--bg3); color: var(--muted); border: 1px solid var(--line); cursor: pointer; }
    .btn-unlock:hover { border-color: var(--verde2); color: var(--verde3); }
    .estudo-progress { margin: 16px 0; }
    .estudo-progress-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .estudo-progress-fill { height: 100%; background: var(--verde); border-radius: 3px; transition: width .3s; }
    .estudo-progress-text { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>

<div id="toast"></div>

<script>
  /* ── Toast ── */
  let _toastTimer;
  function showToast(msg, duration = 3500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  }

  /* ── TTS helper ── */
  async function speak(text, opts = {}) {
    const voice = opts.voiceOverride
      || localStorage.getItem('dezasseis:voice')
      || 'joana';
    const diag = document.getElementById('audio-diag');
    if (diag) {
      diag.className = '';
      diag.textContent = `A enviar… voz=${voice}`;
    }
    let r;
    try {
      r = await fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice }),
      });
    } catch (e) {
      const msg = `Erro de rede: ${e.message}`;
      showToast(`🔇 ${msg}`);
      if (diag) { diag.className = 'err'; diag.textContent = msg; }
      return;
    }
    if (!r.ok) {
      const msg = `TTS erro: ${r.status} ${r.statusText}`;
      showToast(`🔇 ${msg}`);
      if (diag) { diag.className = 'err'; diag.textContent = msg; }
      return;
    }
    if (r.headers.get('X-Voice-Fallback') === 'sarah') {
      showToast('Voz principal indisponível — a usar Sarah');
      if (diag) diag.textContent = 'Fallback para Sarah (voz principal indisponível)';
    } else if (diag) {
      diag.className = 'ok';
      diag.textContent = `OK — voz=${voice}, ${r.headers.get('Content-Length') || '?'} bytes`;
    }
    const blob = await r.blob();
    const audio = new Audio(URL.createObjectURL(blob));
    audio.play();
  }

  /* ── Navigation ── */
  function openTool(name) {
    document.getElementById('home').hidden = true;
    const t = document.getElementById('tool');
    t.hidden = false;
    if (name === 'verbos') {
      renderVerbMachine();
    } else {
      t.innerHTML = `
        <button class="tool-back" onclick="goHome()">← Voltar</button>
        <div class="tool-name">${name}</div>
        <div class="tool-under">Em construção.</div>
      `;
    }
  }
  function goHome() {
    document.getElementById('home').hidden = false;
    document.getElementById('tool').hidden = true;
  }
  document.querySelectorAll('[data-tool]').forEach(b => {
    b.onclick = () => openTool(b.dataset.tool);
  });

  /* ══════════════════════════════════════════════════════════════
     MÁQUINA DE VERBOS — Task 1.4
     ══════════════════════════════════════════════════════════════ */

  /* Theory copy verbatim from Spec Appendix A */
  const TENSE_THEORY = {
    presente: `Now, near-future, habits, universal truths. <code>Falo português</code> = "I speak Portuguese" or "I am speaking." Portuguese does NOT have a separate progressive tense used the way English does — <code>Estou a falar</code> (pt-PT) or <code>Estou falando</code> (pt-BR) exists but the plain Presente carries most work. Same behavior as Spanish <em>hablo</em>.`,

    pret_perf_simples: `Your main past. <code>Falei ontem</code> = "I spoke yesterday." One completed event, dated or datable. <em>Big trap from Spanish</em>: this is what you use for "I ate," "I saw," "I went" — NOT the compound tense. If you catch yourself building <code>tenho comido</code> for "I ate," stop — that means something else (see Ter as auxiliary card in Do Espanhol).`,

    pret_imperfeito: `Background past, habits, states, ongoing conditions. <code>Quando era criança, falava com o meu avô</code> = "When I was a kid, I used to talk with my grandfather." Same instinct as Spanish <em>hablaba</em>. Rule of thumb: if English uses "used to" or "was ___-ing" for background, use Imperfeito.`,

    futuro_perifr: `Near future, plans, decisions just made. <code>Vou almoçar agora</code> = "I'm going to have lunch now." This is what Portuguese speakers use in daily speech ~90% of the time for future — the "textbook" Futuro Simples (<em>falarei</em>) is more formal/written. Learn this one first, use it always.`,

    futuro_simples: `<em>Recognize-only.</em> Formal, written, predictions, promises. <code>Falarei com ele amanhã</code> = "I will speak with him tomorrow." You'll see it in news, contracts, formal writing; in speech you'll almost always hear the perifrástico form instead. Recognize it, don't reach for it.`,

    condicional: `<em>Recognize-only.</em> "Would" — polite requests, hypotheticals, softened statements. <code>Gostaria de um café</code> = "I would like a coffee." Portuguese also uses Imperfeito for the same softening (<code>Queria um café</code>), which is more common in casual speech. Recognize it; use Imperfeito or <code>podia</code>/<code>queria</code> first.`,

    pres_conjuntivo: `<em>Recognize-only.</em> Subjunctive after doubt, wish, emotion, negation, impersonal expressions. <code>Espero que fales português</code> = "I hope you speak Portuguese." Same trigger family as Spanish <em>hable</em> (WEIRDO-style). Recognize the shape; production comes later.`,

    fut_conjuntivo: `<em>Recognize-only.</em> <strong>Alive in Portuguese, dead in Spanish.</strong> Used after <code>quando / se / enquanto / assim que</code> when the action is future or hypothetical. <code>Quando fores a Lisboa, avisa-me</code> = "When you go to Lisbon, tell me." Formed from the 3rd-person plural preterite stem: <code>falaram → falares/falar/falarmos/falarem</code>. Recognize it everywhere — you'll hear it constantly.`,

    inf_pessoal: `<em>Recognize-only.</em> <strong>Unique to Portuguese.</strong> A conjugated infinitive — English and Spanish have nothing like it. <code>É importante para eu falar bem</code> = "It's important for me to speak well." Forms: <code>falar / falares / falar / falarmos / falarem</code>. Recognize it in speech and text; it's how Portuguese speakers avoid clunky "para que" subordinate clauses.`,
  };

  /* State for the verb machine */
  let _vmFilter = { query: '', category: '' };

  /* Speak all 6 forms of a tense with 800ms gap */
  let _speakAllTimer = null;
  async function speakAllForms(forms) {
    if (_speakAllTimer) { clearTimeout(_speakAllTimer); _speakAllTimer = null; }
    for (let i = 0; i < forms.length; i++) {
      await new Promise(resolve => {
        _speakAllTimer = setTimeout(async () => {
          await speak(forms[i]);
          resolve();
        }, i === 0 ? 0 : 800);
      });
    }
  }

  /* Render a single tense section */
  function renderTenseSection(tenseKey, forms) {
    const meta = TENSE_META[tenseKey] || { label: tenseKey, drilled: false };
    const isDrilled = meta.drilled;
    const sectionClass = isDrilled ? 'tense-drilled' : 'tense-recognize';
    const theory = TENSE_THEORY[tenseKey] || '';

    const formsHtml = PRONOUNS_PT.map((pronoun, idx) => {
      const isVos = idx === 4; // vós is index 4
      const form = forms[idx] || '—';
      return `
        <div class="form-row${isVos ? ' form-vos' : ''}">
          <span class="form-pronoun">${pronoun}${isVos ? '<span class="vos-hint">(arc.)</span>' : ''}</span>
          <span class="form-word">${form}</span>

    const formsArray = JSON.stringify(forms);

  }

  /* ══════════════════════════════════════════════════════════════
     PRATICAR — Drill mode (Task 1.5)
     ══════════════════════════════════════════════════════════════ */

  /* Accent-strip helper: lowercase + NFD decompose + strip combining diacritics */
  function stripAccents(s) {
    return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  /* localStorage key */
  const LS_KEY = 'dezasseis:v1';

  function loadStore() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function saveStore(store) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
  }

  /* verb_weights: { "falar|presente|0": { correct: N, wrong: N }, … } */
  function weightKey(infinitive, tenseKey, personIdx) {
    return `${infinitive}|${tenseKey}|${personIdx}`;
  }
  function updateWeight(infinitive, tenseKey, personIdx, wasCorrect) {
    const store = loadStore();
    if (!store.verb_weights) store.verb_weights = {};
    const k = weightKey(infinitive, tenseKey, personIdx);
    if (!store.verb_weights[k]) store.verb_weights[k] = { correct: 0, wrong: 0 };
    if (wasCorrect) store.verb_weights[k].correct++;
    else store.verb_weights[k].wrong++;
    saveStore(store);
  }

  /* Weighted random draw from VERBS × DRILLED_TENSES × 6 persons
     Weight = 1 + (wrong * 2) for combos with mistakes, 1 for fresh ones.
     personIdx 4 (vós) is excluded from drill (archaic). */

  function drawDrillItem(pinVerb) {
    const store = loadStore();
    const weights = store.verb_weights || {};

    // Build candidate pool
    const pool = [];
    const source = pinVerb ? VERBS.filter(v => v.infinitive === pinVerb) : VERBS;

    source.forEach(verb => {
      DRILLED_TENSES.forEach(tenseKey => {
        DRILL_PERSON_IDXS.forEach(personIdx => {
          const k = weightKey(verb.infinitive, tenseKey, personIdx);
          const w = weights[k] || { correct: 0, wrong: 0 };
          const weight = 1 + (w.wrong * 2);
          pool.push({ verb, tenseKey, personIdx, weight });
        });
      });
    });

    // Weighted random selection
    const total = pool.reduce((sum, c) => sum + c.weight, 0);
    let rand = Math.random() * total;
    for (const candidate of pool) {
      rand -= candidate.weight;
      if (rand <= 0) return candidate;
    }
    return pool[pool.length - 1];
  }

  /* Drill state */
  let _drillState = {
    pinVerb: null,      // null = any verb, string = locked infinitive
    sessionCorrect: 0,
    sessionWrong: 0,
    current: null,      // { verb, tenseKey, personIdx }
    answered: false,
  };

  function renderVerbDrill(pinVerb) {
    _drillState.pinVerb = pinVerb || null;
    _drillState.sessionCorrect = 0;
    _drillState.sessionWrong = 0;
    _drillState.answered = false;
    _drillState.current = drawDrillItem(_drillState.pinVerb);
    _renderDrillScreen();
  }

  function _renderDrillScreen() {
    const { verb, tenseKey, personIdx } = _drillState.current;
    const tenseLabel = TENSE_META[tenseKey].label;
    const pronoun = PRONOUNS_PT[personIdx];
    const { sessionCorrect, sessionWrong } = _drillState;
    const total = sessionCorrect + sessionWrong;

    const t = document.getElementById('tool');
    t.innerHTML = `
      <div class="drill-header">
        <button class="btn-sair" id="drill-sair-btn">← Sair</button>
        <div class="drill-score">
          <span class="drill-correct">${sessionCorrect}✓</span>
          &nbsp;/&nbsp;
          <span class="drill-wrong">${sessionWrong}✗</span>
          ${total > 0 ? `&nbsp;·&nbsp;${Math.round(sessionCorrect/total*100)}%` : ''}
        </div>
      </div>
      <div class="drill-card">
        <div class="drill-tense-label">${tenseLabel}</div>
        <div class="drill-verb-en">${verb.en}</div>
        <div class="drill-infinitive">${verb.infinitive}</div>
        <div class="drill-pronoun">${pronoun}</div>
        <div class="drill-label">Escreve a forma:</div>
        <input class="drill-input" id="drill-input" type="text"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="…" aria-label="Resposta">
        <div class="drill-feedback" id="drill-feedback"></div>
      </div>
      <div class="drill-actions">
        <button class="btn-proximo" id="drill-check-btn">Verificar</button>
      </div>
    `;
    t.scrollTop = 0;
    window.scrollTo(0, 0);

    const input = document.getElementById('drill-input');
    const checkBtn = document.getElementById('drill-check-btn');
    const sairBtn = document.getElementById('drill-sair-btn');

    input.focus();

    // Allow Enter to submit / advance
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkBtn.click();
    });

    checkBtn.onclick = () => {
      if (_drillState.answered) {
        // Advance to next
        _drillState.answered = false;
        _drillState.current = drawDrillItem(_drillState.pinVerb);
        _renderDrillScreen();
        return;
      }
      _checkDrillAnswer();
    };

    sairBtn.onclick = () => renderVerbMachine();
  }

  function _checkDrillAnswer() {
    const { verb, tenseKey, personIdx } = _drillState.current;
    const correct = verb.conjugations[tenseKey][personIdx];
    const userRaw = document.getElementById('drill-input').value.trim();
    const feedback = document.getElementById('drill-feedback');
    const input = document.getElementById('drill-input');
    const checkBtn = document.getElementById('drill-check-btn');

    if (!userRaw) return; // do nothing on empty

    const userNorm = stripAccents(userRaw);
    const correctNorm = stripAccents(correct);
    const exactMatch = userRaw.toLowerCase() === correct.toLowerCase();
    const accentMatch = !exactMatch && userNorm === correctNorm;

    let wasCorrect;

    if (exactMatch || accentMatch) {
      wasCorrect = true;
      _drillState.sessionCorrect++;
      if (accentMatch) {
        input.classList.add('correct');
        feedback.className = 'drill-feedback accent';
        feedback.textContent = `atenção ao acento: correto = ${correct}, escreveste = ${userRaw}`;
      } else {
        input.classList.add('correct');
        feedback.className = 'drill-feedback ok';
        feedback.textContent = `Correto! ✓`;
      }
    } else {
      wasCorrect = false;
      _drillState.sessionWrong++;
      input.classList.add('wrong');
      feedback.className = 'drill-feedback err';
      feedback.textContent = `Errado. Correto: ${correct}`;
    }

    updateWeight(verb.infinitive, tenseKey, personIdx, wasCorrect);
    _drillState.answered = true;

    // Update score display
    const { sessionCorrect, sessionWrong } = _drillState;
    const total = sessionCorrect + sessionWrong;
    const scoreEl = document.querySelector('.drill-score');
    if (scoreEl) {
      scoreEl.innerHTML = `
        <span class="drill-correct">${sessionCorrect}✓</span>
        &nbsp;/&nbsp;
        <span class="drill-wrong">${sessionWrong}✗</span>
        ${total > 0 ? `&nbsp;·&nbsp;${Math.round(sessionCorrect/total*100)}%` : ''}
      `;
    }

    // Swap button label to "Próximo"
    checkBtn.textContent = 'Próximo →';
    checkBtn.focus();

    // Disable input
    input.disabled = true;
  }

  /* ────────────────────────────────────────────────────────────
     VERBS — 182 pt-PT verbs × 9 tenses × 6 person-forms
     Generated per Task 1.3 (Option C hybrid: 146 mirror from
     Dieciséis + 36 pt-PT-life additions).
     ──────────────────────────────────────────────────────────── */

  const PRONOUNS_PT = ['eu','tu','ele/ela/você','nós','vós','eles/elas/vocês'];

  const TENSE_META = {
    presente:          { label: 'Presente',                    drilled: true  },
    pret_perf_simples: { label: 'Pretérito Perfeito Simples',  drilled: true  },
    pret_imperfeito:   { label: 'Pretérito Imperfeito',        drilled: true  },
    futuro_perifr:     { label: 'Futuro Perifrástico',         drilled: true  },
    futuro_simples:    { label: 'Futuro Simples',              drilled: false },
    condicional:       { label: 'Condicional',                 drilled: false },
    pres_conjuntivo:   { label: 'Presente do Conjuntivo',      drilled: false },
    fut_conjuntivo:    { label: 'Futuro do Conjuntivo',        drilled: false },
    inf_pessoal:       { label: 'Infinitivo Pessoal',          drilled: false },
  };

  /* ── Auxiliary "ir" for Futuro Perifrástico (hand-set since ir is irregular) ── */
  const IR_AUX = ['vou','vais','vai','vamos','ides','vão'];

  /* ── Regular-conjugation engine ── */
  function conjRegular(inf) {
    const stem = inf.slice(0, -2);
    const fam = inf.slice(-2); // 'ar' | 'er' | 'ir'

    // Preterite 1sg orthographic mutations for -ar family
    let stem1sgPret = stem;
    if (fam === 'ar') {
      if (stem.endsWith('c')) stem1sgPret = stem.slice(0, -1) + 'qu';   // ficar → fiquei
      else if (stem.endsWith('g')) stem1sgPret = stem + 'u';             // pagar → paguei
      else if (stem.endsWith('ç')) stem1sgPret = stem.slice(0, -1) + 'c';// começar → comecei
    }
    // Presente 1sg orthographic mutations for -er/-ir families
    // (before 'o': c→ç, g→j)
    let stem1sgPres = stem;
    if (fam === 'er' || fam === 'ir') {
      if (stem.endsWith('c')) stem1sgPres = stem.slice(0, -1) + 'ç';   // vencer → venço
      else if (stem.endsWith('g')) stem1sgPres = stem.slice(0, -1) + 'j'; // erguer → ergo (rare) ; proteger → protejo
    }
    // Presente do Conjuntivo stem — from present 1sg minus final 'o'
    // For -ar: base stem + subj endings starting with -e
    // For -er/-ir: stem1sgPres + subj endings starting with -a
    // Additional orthographic mutation for -ar subj (before 'e'):
    //   c → qu, g → gu, ç → c
    let stemSubj = stem;
    if (fam === 'ar') {
      if (stem.endsWith('c')) stemSubj = stem.slice(0, -1) + 'qu';
      else if (stem.endsWith('g')) stemSubj = stem + 'u';
      else if (stem.endsWith('ç')) stemSubj = stem.slice(0, -1) + 'c';
    } else {
      stemSubj = stem1sgPres;
    }

    // --- Presente ---
    let presente;
    if (fam === 'ar') {
      presente = [stem+'o', stem+'as', stem+'a', stem+'amos', stem+'ais', stem+'am'];
    } else if (fam === 'er') {
      presente = [stem1sgPres+'o', stem+'es', stem+'e', stem+'emos', stem+'eis', stem+'em'];
    } else {
      presente = [stem1sgPres+'o', stem+'es', stem+'e', stem+'imos', stem+'is', stem+'em'];
    }

    // --- Pretérito Perfeito Simples ---
    // pt-PT: -ar family carries acute on 1pl (falámos, not falamos)
    let pret;
    if (fam === 'ar') {
      pret = [stem1sgPret+'ei', stem+'aste', stem+'ou', stem+'ámos', stem+'astes', stem+'aram'];
    } else if (fam === 'er') {
      pret = [stem+'i', stem+'este', stem+'eu', stem+'emos', stem+'estes', stem+'eram'];
    } else {
      pret = [stem+'i', stem+'iste', stem+'iu', stem+'imos', stem+'istes', stem+'iram'];
    }

    // --- Pretérito Imperfeito ---
    let imperf;
    if (fam === 'ar') {
      imperf = [stem+'ava', stem+'avas', stem+'ava', stem+'ávamos', stem+'áveis', stem+'avam'];
    } else {
      // -er and -ir share
      imperf = [stem+'ia', stem+'ias', stem+'ia', stem+'íamos', stem+'íeis', stem+'iam'];
    }

    // --- Futuro Perifrástico: ir + infinitive ---
    const futPerifr = IR_AUX.map(a => a + ' ' + inf);

    // --- Futuro Simples: infinitive + endings ---
    const futSimp = [inf+'ei', inf+'ás', inf+'á', inf+'emos', inf+'eis', inf+'ão'];

    // --- Condicional: infinitive + endings ---
    const cond = [inf+'ia', inf+'ias', inf+'ia', inf+'íamos', inf+'íeis', inf+'iam'];

    // --- Presente do Conjuntivo ---
    let presConj;
    if (fam === 'ar') {
      presConj = [stemSubj+'e', stemSubj+'es', stemSubj+'e', stemSubj+'emos', stemSubj+'eis', stemSubj+'em'];
    } else {
      // -er / -ir share endings -a/-as/-a/-amos/-ais/-am; use 1sg-present stem
      presConj = [stemSubj+'a', stemSubj+'as', stemSubj+'a', stemSubj+'amos', stemSubj+'ais', stemSubj+'am'];
    }

    // --- Futuro do Conjuntivo (regular = infinitive-based) ---
    const futConj = [inf, inf+'es', inf, inf+'mos', inf+'des', inf+'em'];

    // --- Infinitivo Pessoal ---
    const infPess = [inf, inf+'es', inf, inf+'mos', inf+'des', inf+'em'];

    return {
      presente,
      pret_perf_simples: pret,
      pret_imperfeito: imperf,
      futuro_perifr: futPerifr,
      futuro_simples: futSimp,
      condicional: cond,
      pres_conjuntivo: presConj,
      fut_conjuntivo: futConj,
      inf_pessoal: infPess,
    };
  }

  /* ── VERB_META (English gloss + Portuguese category) ── */

    {

      en: 'Object Pronouns & Clitic Placement',
      notes: `<p>Os <b>pronomes clíticos</b> em português são: <em>me, te, o/a, nos, vos, os/as</em>. "O/a" são acusativos (complemento direto); "me/te/nos/vos" servem tanto acusativo como dativo. A forma de dativo de 3ª pessoa é <b>lhe/lhes</b>: <em>Dei-lhe o livro</em> (I gave him the book).</p>
      <p>A regra base de pt-PT: <b>enclítico</b> — o pronome vai depois do verbo, ligado por hífen: <em>Chamo-<b>me</b> João. Dá-<b>me</b> isso. Vejo-<b>o</b> amanhã.</em></p>
      <p><b>Gatilhos proclíticos</b> (pronome antes do verbo): negação (<em>não o vi</em>), pronomes relativos (<em>quem o viu</em>), conjunções subordinantes (<em>que me disse</em>), advérbios de negação/indefinição (<em>nunca me fez isso, alguém me chamou</em>). Em pt-PT formal, o enclítico é o padrão; o proclítico só aparece com estes gatilhos.</p>`,

    {

      en: 'Personal Infinitive — unique to Portuguese',
      notes: `<p>O <b>infinitivo pessoal</b> é uma das características mais distintas do português — não existe em espanhol, francês, inglês, ou qualquer outro romance. É um infinitivo <em>conjugado</em>: o mesmo verbo tem seis formas com sujeito implícito.</p>
      <p>Formação: parte do infinitivo, e acrescenta-se <em>-es, -mos, -des, -em</em> nas pessoas correspondentes. Para <em>falar</em>: <b>falar, falares, falar, falarmos, falardes, falarem</b>. 1ª e 3ª pessoa singular são iguais ao infinitivo — a diferença está nas outras.</p>
      <p>Usa-se quando o sujeito da subordinada é diferente do da principal, especialmente após preposições: <em>para eu entender</em> (so that I understand), <em>sem eles saberem</em> (without them knowing), <em>antes de nós chegarmos</em> (before we arrive). Evita o conjuntivo em muitos casos e é muito mais comum em pt-PT falado do que os livros sugerem.</p>`,

          { prompt: 'Quando usar o infinitivo pessoal vs impessoal?', answer: 'Quando o sujeito da subordinada é diferente do da principal', options: ['Quando o sujeito da subordinada é diferente do da principal', 'Sempre que há preposição', 'Apenas em frases formais', 'Apenas com "para"'] },
          { prompt: '"after you (tu) arrive" — forma correta?', answer: 'depois de chegares', options: ['depois de chegares', 'depois de chegar', 'depois de chegarmos', 'depois de chegares tu'] },
          { prompt: 'O infinitivo pessoal existe em…', choices: undefined, answer: 'Apenas em português (e galego)', options: ['Apenas em português (e galego)', 'Português e espanhol', 'Português e francês', 'Todas as línguas românicas'] },
        ],
      },
      quiz: [
        { q: 'Infinitivo pessoal de "comer" — 2ª pessoa singular (tu)?', choices: ['comeres', 'comer', 'comermos', 'comerem'], correct: 0 },
        { q: '"para eu entender" — o infinitivo pessoal usa-se porque…', choices: ['O sujeito ("eu") é explícito e diferente do da principal', 'Sempre após "para"', 'É mais formal', 'O conjuntivo é mais difícil'], correct: 0 },
        { q: '"Saíram sem ___ reparar." (eles) — forma correta?', choices: ['repararem', 'reparar', 'reparares', 'reparando'], correct: 0 },
        { q: 'O infinitivo pessoal é único em português porque…', choices: ['É um infinitivo conjugado — inexistente noutras línguas', 'Usa terminações do conjuntivo', 'É formado com "ter + particípio"', 'Só existe no passado'], correct: 0 },
        { q: '"antes de nós ___ (ir)" — infinitivo pessoal correto?', choices: ['irmos', 'ir', 'irdes', 'irem'], correct: 0 },
        { q: 'Qual frase usa CORRETAMENTE o infinitivo pessoal?', choices: ['"Liguei antes de eles chegarem."', '"Liguei antes de eles chegar."', '"Liguei antes eles chegam."', '"Liguei antes que eles chegassem." (também válido, mas não inf. pessoal)'], correct: 0 },
      ],
    },

    // Lessons 9-16: locked stubs (Em breve — Phase 3)
    { id: 9, title: 'Futuro: Perifrástico e Simples', en: 'Future Tense (periphrastic + simple)', locked: true },
    { id: 10, title: 'Conjuntivo: Presente e Futuro', en: 'Subjunctive: Present & Future', locked: true },
    { id: 11, title: 'Frases Relativas', en: 'Relative Clauses', locked: true },
    { id: 12, title: 'Voz Passiva', en: 'Passive Voice', locked: true },
    { id: 13, title: 'Condicional e Hipótese', en: 'Conditional & Hypothesis', locked: true },
    { id: 14, title: 'Preposições: a, em, de, por, para', en: 'Prepositions Deep Dive', locked: true },
    { id: 15, title: 'Discurso Indireto', en: 'Reported Speech', locked: true },
    { id: 16, title: 'Síntese Final', en: 'Final Synthesis', locked: true },
  ];

  // Expose for schema validator
  window.LESSONS = LESSONS;

  /* ── Estudo localStorage helpers ── */
  function getLessonScores() {
    const store = loadStore();
    return store.lesson_scores || {};
  }
  function setLessonScore(id, pct) {
    const store = loadStore();
    if (!store.lesson_scores) store.lesson_scores = {};
    const prev = store.lesson_scores[id] || 0;
    store.lesson_scores[id] = Math.max(prev, pct);
    saveStore(store);
  }
  function lessonPassed(id) {
    return (getLessonScores()[id] || 0) >= 0.75;
  }
  function isLessonUnlocked(lesson) {
    if (lesson.locked) return false; // stub
    if (lesson.id === 1) return true;
    return lessonPassed(lesson.id - 1);
  }
  function unlockLesson(id) {
    // Force unlock (gate bypass)
    const store = loadStore();
    if (!store.lesson_scores) store.lesson_scores = {};
    store.lesson_scores[id] = Math.max(store.lesson_scores[id] || 0, 0.75);
    saveStore(store);
    renderEstudo();
  }

  /* ── Estudo state ── */
  let _estudo = {
    lessonId: null,
    tab: 'learn',  // 'learn' | 'drill' | 'quiz'
    drillIdx: 0,
    drillItems: [],
    drillAnswered: false,
    quizIdx: 0,
    quizScore: 0,
    quizLocked: false,
  };

  /* ── renderEstudo: lesson list ── */
  function renderEstudo() {
    const scores = getLessonScores();
    const passed = Object.values(scores).filter(v => v >= 0.75).length;
    const pct = Math.round(passed / 8 * 100);

    const tiles = LESSONS.map(L => {
      if (L.locked) {
        return `<div class="estudo-tile locked" title="Em breve">
          <div class="estudo-tile-left">
            <span class="estudo-tile-num">Lição ${L.id}</span>
            <span class="estudo-tile-title">${L.title}</span>
            <span class="estudo-tile-en">${L.en}</span>
          </div>
          <div class="estudo-tile-right">
            <span class="estudo-lock-icon">🔒</span>
            <span class="estudo-soon">Em breve</span>
          </div>
        </div>`;
      }
      const score = scores[L.id];
      const unlocked = isLessonUnlocked(L);
      const isLocked = !unlocked && L.id !== 1;
      const scoreLabel = score !== undefined ? `${Math.round(score * 100)}%` : null;
      const passed = score !== undefined && score >= 0.75;
      return `<div class="estudo-tile${passed ? ' completed' : ''}${isLocked ? ' locked' : ''}"
          onclick="${isLocked ? `unlockLesson(${L.id - 1})` : `openEstudoLesson(${L.id})`}"
          title="${isLocked ? 'Completa a lição anterior para desbloquear (toca para ignorar o gate)' : L.title}">
        <div class="estudo-tile-left">
          <span class="estudo-tile-num">Lição ${L.id}</span>
          <span class="estudo-tile-title">${L.title}</span>
          <span class="estudo-tile-en">${L.en}</span>
        </div>
        <div class="estudo-tile-right">
          ${scoreLabel ? `<span class="estudo-score-badge${passed ? '' : ' fail'}">${scoreLabel}</span>` : ''}
          ${isLocked ? `<span class="estudo-lock-icon">🔓</span><span class="estudo-soon">toca para ignorar</span>` : ''}
          ${passed ? '<span style="color:var(--verde3);font-size:18px">✓</span>' : ''}
        </div>
      </div>`;
    }).join('');

    const t = document.getElementById('tool');
    t.innerHTML = `
      <button class="tool-back" onclick="goHome()">← Voltar</button>
      <div class="tool-name">Estudo <span style="font-size:16px;font-weight:400;color:var(--muted)">16 lições</span></div>
      <div class="estudo-progress">
        <div class="estudo-progress-bar"><div class="estudo-progress-fill" style="width:${pct}%"></div></div>
        <div class="estudo-progress-text">${passed} / 8 lições concluídas · Lições 9-16 em breve</div>
      </div>
      <div class="estudo-list">${tiles}</div>
    `;
    t.scrollTop = 0; window.scrollTo(0, 0);
  }

  function openEstudoLesson(id) {
    _estudo.lessonId = id;
    _estudo.tab = 'learn';
    renderEstudoLesson();
  }

  /* ── renderEstudoLesson: learn tab ── */
  function renderEstudoLesson() {
    const L = LESSONS.find(x => x.id === _estudo.lessonId);
    if (!L) return;

    const tabBtns = ['learn','drill','quiz'].map(tab => {
      const labels = { learn: 'Aprender', drill: 'Exercício', quiz: 'Teste' };
      return `<button class="lesson-tab${_estudo.tab === tab ? ' active' : ''}" onclick="setEstudoTab('${tab}')">${labels[tab]}</button>`;
    }).join('');

    const notes = L.notes.replace(/<b>([^<]+)<\/b>/g, (m, txt) =>
      `<b onclick="speak('${txt.replace(/'/g,"\\'")}')" title="ouvir: ${txt.replace(/"/g,'&quot;')}">${txt}</b>`);

    const tablesHtml = (L.tables || []).map(tbl => `
      <div class="lesson-table-title">${tbl.title}</div>
      <table class="lesson-table">
        ${tbl.rows.map(r => `<tr><td onclick="speak('${r[0].replace(/'/g,"\\'")}')" title="ouvir">${r[0]} 🔊</td><td>${r[1]}</td></tr>`).join('')}
      </table>
    `).join('');

    const vocabHtml = (L.vocab || []).map(v =>
      `<div class="vocab-item">
        <span class="vocab-pt">${v.pt}</span>
        <span class="vocab-en">${v.en}</span>
        <button class="vocab-speak" onclick="speak('${v.pt.replace(/'/g,"\\'")}')" title="ouvir">🔊</button>
      </div>`
    ).join('');

    const t = document.getElementById('tool');
    t.innerHTML = `
      <button class="tool-back" onclick="renderEstudo()">← Todas as lições</button>
      <div class="lesson-header">
        <div class="lesson-title-pt">Lição ${L.id}: ${L.title}</div>
        <div class="lesson-title-en">${L.en}</div>
      </div>
      <div class="lesson-tabs">${tabBtns}</div>
      <div class="lesson-notes">${notes}</div>
      ${tablesHtml}
      <div class="vocab-section">
        <div class="vocab-label">Vocabulário · ${(L.vocab||[]).length} palavras</div>
        <div class="vocab-grid">${vocabHtml}</div>
      </div>
      <div class="drill-actions" style="margin-top:20px">
        <button class="btn-estudo" onclick="setEstudoTab('drill')">Começar o exercício →</button>
      </div>
    `;
    t.scrollTop = 0; window.scrollTo(0, 0);
  }

  function setEstudoTab(tab) {
    _estudo.tab = tab;
    if (tab === 'learn') renderEstudoLesson();
    else if (tab === 'drill') startEstudoDrill();
    else if (tab === 'quiz') startEstudoQuiz();
  }

  /* ── Drill ── */
  function startEstudoDrill() {
    const L = LESSONS.find(x => x.id === _estudo.lessonId);
    if (!L || !L.drill) return;
    _estudo.drillItems = [...L.drill.items];
    // Shuffle
    for (let i = _estudo.drillItems.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [_estudo.drillItems[i], _estudo.drillItems[j]] = [_estudo.drillItems[j], _estudo.drillItems[i]];
    }
    _estudo.drillIdx = 0;
    _estudo.drillAnswered = false;
    renderEstudoDrill();
  }

  function renderEstudoDrill() {
    const L = LESSONS.find(x => x.id === _estudo.lessonId);
    const items = _estudo.drillItems;
    const tabBtns = ['learn','drill','quiz'].map(tab => {
      const labels = { learn: 'Aprender', drill: 'Exercício', quiz: 'Teste' };
      return `<button class="lesson-tab${tab === 'drill' ? ' active' : ''}" onclick="setEstudoTab('${tab}')">${labels[tab]}</button>`;
    }).join('');
    const header = `
      <button class="tool-back" onclick="renderEstudo()">← Todas as lições</button>
      <div class="lesson-header">
        <div class="lesson-title-pt">Lição ${L.id}: ${L.title}</div>
      </div>
      <div class="lesson-tabs">${tabBtns}</div>
    `;

    if (_estudo.drillIdx >= items.length) {
      // Done
      const t = document.getElementById('tool');
      t.innerHTML = `${header}
        <div class="quiz-result">
          <div style="font-size:40px;margin-bottom:12px">✓</div>
          <div class="quiz-result-msg">${items.length} exercícios concluídos!</div>
          <div class="quiz-result-actions">
            <button class="btn-estudo secondary" onclick="startEstudoDrill()">Repetir</button>
            <button class="btn-estudo" onclick="setEstudoTab('quiz')">Fazer o teste →</button>
          </div>
        </div>`;
      t.scrollTop = 0; window.scrollTo(0, 0);
      return;
    }

    const item = items[_estudo.drillIdx];
    // Shuffle options each render only if not answered
    const shuffled = _estudo.drillAnswered ? item._shuffled : shuffleArr([...item.options]);
    if (!_estudo.drillAnswered) item._shuffled = shuffled;

    const opts = shuffled.map((opt, i) => {
      let cls = '';
      if (_estudo.drillAnswered) {
        if (opt === item.answer) cls = ' correct';
        else if (opt === item._chosen) cls = ' wrong';
      }
      return `<button class="estudo-drill-opt${cls}"
        ${_estudo.drillAnswered ? 'disabled' : ''}
        onclick="answerEstudoDrill('${opt.replace(/'/g,"\\'")}')">${opt}</button>`;
    }).join('');

    const t = document.getElementById('tool');
    t.innerHTML = `${header}
      <div class="estudo-drill-card">
        <div class="estudo-drill-num">${_estudo.drillIdx + 1} / ${items.length}</div>
        <div class="estudo-drill-prompt">${item.prompt}</div>
        <div class="estudo-drill-options">${opts}</div>
        ${_estudo.drillAnswered ? `<div class="estudo-drill-answer">Resposta: ${item.answer} <button onclick="speak('${item.answer.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;font-size:14px">🔊</button></div>` : ''}
      </div>
      <div class="drill-actions">
        ${_estudo.drillAnswered
          ? `<button class="btn-estudo" onclick="advanceEstudoDrill()">Próximo →</button>`
          : `<button class="btn-estudo secondary small" onclick="advanceEstudoDrill()">Saltar</button>`}
      </div>`;
    t.scrollTop = 0; window.scrollTo(0, 0);
  }

  function answerEstudoDrill(chosen) {
    if (_estudo.drillAnswered) return;
    const item = _estudo.drillItems[_estudo.drillIdx];
    item._chosen = chosen;
    _estudo.drillAnswered = true;
    if (chosen === item.answer) speak(item.answer);
    renderEstudoDrill();
  }

  function advanceEstudoDrill() {
    _estudo.drillIdx++;
    _estudo.drillAnswered = false;
    renderEstudoDrill();
  }

  function shuffleArr(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ── Quiz ── */
  function startEstudoQuiz() {
    _estudo.quizIdx = 0;
    _estudo.quizScore = 0;
    _estudo.quizLocked = false;
    renderEstudoQuiz();
  }

  function renderEstudoQuiz() {
    const L = LESSONS.find(x => x.id === _estudo.lessonId);
    const quiz = L.quiz || [];
    const tabBtns = ['learn','drill','quiz'].map(tab => {
      const labels = { learn: 'Aprender', drill: 'Exercício', quiz: 'Teste' };
      return `<button class="lesson-tab${tab === 'quiz' ? ' active' : ''}" onclick="setEstudoTab('${tab}')">${labels[tab]}</button>`;
    }).join('');
    const header = `
      <button class="tool-back" onclick="renderEstudo()">← Todas as lições</button>
      <div class="lesson-header">
        <div class="lesson-title-pt">Lição ${L.id}: ${L.title}</div>
      </div>
      <div class="lesson-tabs">${tabBtns}</div>
    `;
    const t = document.getElementById('tool');

    if (_estudo.quizIdx >= quiz.length) {
      // Results
      const pct = _estudo.quizScore / quiz.length;
      const passed = pct >= 0.75;
      setLessonScore(L.id, pct);
      const nextLesson = LESSONS.find(x => x.id === L.id + 1 && !x.locked);
      t.innerHTML = `${header}
        <div class="quiz-result">
          <div class="quiz-result-score ${passed ? 'pass' : 'fail'}">${_estudo.quizScore}/${quiz.length}</div>
          <div class="quiz-result-msg">${passed
            ? 'Lição concluída! O gate abre para a próxima.'
            : 'Abaixo de 75% — revê o material e tenta de novo.'}</div>
          <div class="quiz-result-actions">
            <button class="btn-estudo secondary" onclick="startEstudoQuiz()">Repetir teste</button>
            ${passed && nextLesson ? `<button class="btn-estudo" onclick="openEstudoLesson(${nextLesson.id})">Próxima lição →</button>` : ''}
            <button class="btn-estudo secondary" onclick="renderEstudo()">Todas as lições</button>
          </div>
        </div>`;
      t.scrollTop = 0; window.scrollTo(0, 0);
      return;
    }

    const Q = quiz[_estudo.quizIdx];
    // Shuffle choices with seed-based rotation for reproducibility
    const choicesWithIdx = Q.choices.map((c, i) => ({ c, i }));
    const seed = (_estudo.lessonId * 7 + _estudo.quizIdx * 13) % Q.choices.length;
    const shuffled = [...choicesWithIdx];
    for (let k = 0; k < seed; k++) shuffled.push(shuffled.shift());

    const opts = shuffled.map(({ c, i }) => {
      return `<button class="quiz-opt" data-idx="${i}"
        onclick="answerEstudoQuiz(${i}, ${Q.correct})"
        >${c}</button>`;
    }).join('');

    t.innerHTML = `${header}
      <div class="quiz-progress">Pergunta ${_estudo.quizIdx + 1} / ${quiz.length} · ${_estudo.quizScore} certa${_estudo.quizScore !== 1 ? 's' : ''}</div>
      <div class="quiz-q" onclick="speak('${Q.q.replace(/'/g,"\\'").replace(/_+/g,'')}')" title="ouvir">${Q.q} 🔊</div>
      <div class="quiz-opts">${opts}</div>`;
    _estudo.quizLocked = false;
    t.scrollTop = 0; window.scrollTo(0, 0);
  }

  function answerEstudoQuiz(chosen, correct) {
    if (_estudo.quizLocked) return;
    _estudo.quizLocked = true;
    document.querySelectorAll('.quiz-opt').forEach(b => {
      const i = +b.dataset.idx;
      if (i === correct) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
      b.disabled = true;
    });
    if (chosen === correct) _estudo.quizScore++;
    setTimeout(() => { _estudo.quizIdx++; renderEstudoQuiz(); }, 900);
  }

  /* ── openTool('estudo') handler — note: this redefines openTool (hoisted last, wins) ── */
  function openTool(name) {
    document.getElementById('home').hidden = true;
    const t = document.getElementById('tool');
    t.hidden = false;
    if (name === 'verbos') {
      renderVerbMachine();
    } else if (name === 'estudo') {
      renderEstudo();
    } else {
      t.innerHTML = `
        <button class="tool-back" onclick="goHome()">← Voltar</button>
        <div class="tool-name">${name}</div>
        <div class="tool-under">Em construção.</div>
      `;
    }
  }

  /* ── Schema validation stub ── */
  const SCHEMAS = {
    // Blocks register their schemas here as they get authored.
    LESSONS: v => Array.isArray(v) && v.length >= 8
      && v.slice(0, 8).every(l => l.id && l.title && l.notes && Array.isArray(l.vocab) && l.vocab.length >= 8),
    VERBS: v => Array.isArray(v) && v.length >= 150
      && v.every(x => x.infinitive && x.category && x.conjugations
        && Object.keys(x.conjugations).length === 9
        && Object.values(x.conjugations).every(t => Array.isArray(t) && t.length === 6)),
    TENSE_META: v => v && typeof v === 'object'
      && Object.keys(v).length === 9
      && Object.values(v).every(t => t.label && typeof t.drilled === 'boolean'),
    PRONOUNS_PT: v => Array.isArray(v) && v.length === 6 && v.every(p => typeof p === 'string'),
  };
  function validateAll() {
    const failed = [];
    for (const [name, schema] of Object.entries(SCHEMAS)) {
      try {
        if (!schema(window[name])) failed.push(name);
      } catch (e) {
        console.error(`Schema exception ${name}:`, e);
        failed.push(name);
      }
    }
    if (failed.length) {
      console.error(`SCHEMA FAILURES: ${failed.join(', ')}`);
      document.body.insertAdjacentHTML('afterbegin',
        `<div style="background:#a00;color:#fff;padding:8px;text-align:center;font-family:monospace;">
         ⚠️ Erro de dados: ${failed.join(', ')} — tools escondidas.</div>`);
      failed.forEach(name => hideToolFor(name));
    }
  }
  function hideToolFor(dataBlockName) {
    // Map from data-block name to tool tile[data-tool] to hide.
    const toolFromBlock = {
      LESSONS: 'estudo', VERBS: 'verbos', OBJETOS_DATA: 'objetos', SLANG_DATA: 'calao',
      FALSE_FRIENDS_DATA: 'falsos', OUVIDO_DATA: 'ouvido',
      SITUACAO_DATA: 'situacao', /* etc */
    };
    const tool = toolFromBlock[dataBlockName];
    if (tool) document.querySelectorAll(`[data-tool="${tool}"]`).forEach(b => b.hidden = true);
  }
  // Call after all data blocks defined:
  window.addEventListener('DOMContentLoaded', validateAll);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
</script>
</body>
</html>
